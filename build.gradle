buildscript {
 repositories { maven { url = 'https://maven.minecraftforge.net' }; maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }; mavenCentral() }
 dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:5.1.77'; classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT' }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'java'
apply plugin: 'org.spongepowered.mixin'
mixin { add sourceSets.main, 'legacyconsole.refmap.json'; config 'legacyconsole.mixins.json' }
version = '1.0.0'
group = 'dev.legacyconsole'
archivesBaseName = 'legacy-console-1.17.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 16; options.compilerArgs += ['-Xmaxerrs','5000'] }
minecraft {
 mappings channel: 'official', version: '1.17.1'
 accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
 runs {
  client { workingDirectory project.file('run'); property 'forge.logging.console.level','info'; mods { legacyconsole { source sourceSets.main } } }
  server { workingDirectory project.file('run-server'); property 'forge.logging.console.level','info'; mods { legacyconsole { source sourceSets.main } } }
 }
}
repositories { mavenCentral() }
configurations { bundled }
dependencies {
 minecraft 'net.minecraftforge:forge:1.17.1-37.1.1'
 bundled 'com.badlogicgames.jamepad:jamepad:2.30.0.0'
 implementation configurations.bundled
 minecraftLibrary 'com.badlogicgames.jamepad:jamepad:2.30.0.0'
 testImplementation 'junit:junit:4.13.2'
 annotationProcessor 'org.spongepowered:mixin:0.8.4:processor'
}
jar {
 from { configurations.bundled.collect { it.isDirectory() ? it : zipTree(it) } }
 exclude 'META-INF/*.SF','META-INF/*.RSA','META-INF/*.DSA','module-info.class'
 from('LICENSE'); from('THIRD-PARTY-NOTICES.md')
 from('licenses') { into 'META-INF/licenses' }
 manifest.attributes('Implementation-Title':'Legacy Console','Implementation-Version':version,'MixinConfigs':'legacyconsole.mixins.json')
 finalizedBy 'reobfJar'
}
task sourcesJar(type: Jar) { archiveClassifier='sources'; from sourceSets.main.allSource }

test { maxHeapSize = "1G"; systemProperty "java.library.path", file("build/natives").absolutePath }

sourceSets {
 joinAddon {
  java.setSrcDirs(['src/joinAddon/java'])
  resources.setSrcDirs(['src/joinAddon/resources'])
  compileClasspath += sourceSets.main.compileClasspath
 }
}
tasks.register('joinAddonJar', Jar) {
 archiveBaseName='legacy-join-compat-1.17.1'
 archiveClassifier=''
 from sourceSets.joinAddon.output
 from('LICENSE')
 manifest.attributes('Implementation-Version':version,'MixinConfigs':'legacyjoincompat.mixins.json')
 finalizedBy 'reobfJoinAddonJar'
}
reobf { joinAddonJar {} }
